<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectFlow - Project & Task Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>📊 ProjectFlow</h1>
            <p class="subtitle">Organize your projects and tasks efficiently</p>
            <p class="subtitle"><a href="master-records.html" style="color: #ffffff; text-decoration: underline; font-weight: 600;">Phase 3: One-to-Many Viewer (Master -> Details)</a></p>
            <p class="subtitle"><a href="detail-records.html" style="color: #ffffff; text-decoration: underline; font-weight: 600;">View All Detail Records</a></p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Projects Section -->
            <section class="section projects-section">
                <div class="section-header">
                    <h2>Projects</h2>
                    <button class="btn btn-primary" id="newProjectBtn">+ New Project</button>
                </div>

                <!-- New Project Form -->
                <form id="projectForm" class="form hidden">
                    <h3>Create New Project</h3>
                    <div class="form-group">
                        <label for="projectName">Project Name *</label>
                        <input type="text" id="projectName" required placeholder="Enter project name">
                    </div>
                    <div class="form-group">
                        <label for="projectDesc">Description</label>
                        <textarea id="projectDesc" placeholder="Enter project description"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="projectStatus">Status *</label>
                        <select id="projectStatus" required>
                            <option value="">Select status</option>
                            <option value="Planning">Planning</option>
                            <option value="In Progress">In Progress</option>
                            <option value="On Hold">On Hold</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-success">Create Project</button>
                        <button type="button" class="btn btn-cancel" id="cancelProjectBtn">Cancel</button>
                    </div>
                </form>

                <!-- Projects List -->
                <div id="projectsList" class="projects-grid">
                    <div class="loading">Loading projects...</div>
                </div>
            </section>

            <!-- Tasks Section -->
            <section class="section tasks-section">
                <div class="section-header">
                    <h2>Tasks</h2>
                    <button class="btn btn-primary" id="newTaskBtn" disabled>+ New Task</button>
                </div>

                <!-- New Task Form -->
                <form id="taskForm" class="form hidden">
                    <h3>Create New Task</h3>
                    <div class="form-group">
                        <label for="taskProject">Project *</label>
                        <select id="taskProject" required disabled>
                            <option value="">Select project first</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskTitle">Task Title *</label>
                        <input type="text" id="taskTitle" required placeholder="Enter task title">
                    </div>
                    <div class="form-group">
                        <label for="taskDesc">Description</label>
                        <textarea id="taskDesc" placeholder="Enter task description"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="taskPriority">Priority *</label>
                            <select id="taskPriority" required>
                                <option value="">Select priority</option>
                                <option value="Low">Low</option>
                                <option value="Medium">Medium</option>
                                <option value="High">High</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="taskStatus">Status *</label>
                            <select id="taskStatus" required>
                                <option value="">Select status</option>
                                <option value="To Do">To Do</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Done">Done</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="taskDueDate">Due Date</label>
                        <input type="date" id="taskDueDate">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-success">Create Task</button>
                        <button type="button" class="btn btn-cancel" id="cancelTaskBtn">Cancel</button>
                    </div>
                </form>

                <!-- Tasks List -->
                <div id="tasksList" class="tasks-list">
                    <p class="empty-state">Select a project to view tasks</p>
                </div>
            </section>
        </main>

        <!-- Status Bar -->
        <footer class="footer">
            <p id="statusMessage" class="status">Ready</p>
            <p class="api-endpoint">Backend: <span id="apiEndpoint">http://localhost:5000</span></p>
        </footer>
    </div>

    <!-- Toast Notifications -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
